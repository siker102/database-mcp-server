{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "titanic-mcp.fullname" . }}
  labels:
    {{- include "titanic-mcp.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "titanic-mcp.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: metrics
      interval: {{ .Values.serviceMonitor.interval }}
{{- end }}
