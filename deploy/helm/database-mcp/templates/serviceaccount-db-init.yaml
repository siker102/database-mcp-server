{{- if .Values.dbInit.enabled }}
# Own ServiceAccount for the db-init hook (created before it), no API token [BSI APP.4.4.A9].
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "database-mcp.fullname" . }}-db-init
  labels:
    {{- include "database-mcp.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
automountServiceAccountToken: false
{{- end }}
