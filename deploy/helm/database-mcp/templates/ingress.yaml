{{- if .Values.ingress.enabled }}
# TLS terminates here; configure TLS 1.3 (or 1.2 with PFS) and a per-IP rate limit on the
# ingress controller (see README).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "database-mcp.fullname" . }}
  labels:
    {{- include "database-mcp.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ .Values.ingress.tlsSecretName }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          # Only the MCP endpoint is published; /metrics is on another port, health stays internal.
          - path: /mcp
            pathType: Exact
            backend:
              service:
                name: {{ include "database-mcp.fullname" . }}
                port:
                  name: http
{{- end }}
