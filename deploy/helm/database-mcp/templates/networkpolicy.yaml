{{- if .Values.networkPolicy.enabled }}
# Default deny for the release's pods, then only what is needed [BSI APP.4.4.A7, APP.4.4.A18].
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "database-mcp.fullname" . }}-default-deny
  labels:
    {{- include "database-mcp.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "database-mcp.selectorLabels" . | nindent 6 }}
  policyTypes: ["Ingress", "Egress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "database-mcp.fullname" . }}-server
  labels:
    {{- include "database-mcp.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "database-mcp.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: server
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressNamespace }}
      ports:
        - port: 8000
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.monitoringNamespace }}
      ports:
        - port: 9090
  egress:
    - to:
        - ipBlock:
            cidr: {{ .Values.networkPolicy.databaseCidr }}
      ports:
        - port: {{ .Values.database.port }}
          protocol: TCP
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "database-mcp.fullname" . }}-db-init
  labels:
    {{- include "database-mcp.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "database-mcp.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: db-init
  policyTypes: ["Ingress", "Egress"]
  egress:
    - to:
        - ipBlock:
            cidr: {{ .Values.networkPolicy.databaseCidr }}
      ports:
        - port: {{ .Values.database.port }}
          protocol: TCP
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
{{- end }}
