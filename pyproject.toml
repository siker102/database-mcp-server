[project]
name = "database-mcp"
version = "0.1.0"
description = "Read-only MCP server that lets AI agents query a PostgreSQL database securely (demo dataset: Titanic)."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "mcp>=2,<3",
    "prometheus-client>=0.26.0",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "sqlalchemy[asyncio]>=2,<3",
    "sqlglot>=30.30.0",
    "structlog>=26.1.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
database-mcp = "database_mcp.cli:main"

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pip-audit>=2.10.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
    "testcontainers[postgres]>=4.15.0",
]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
# E/W/F: pycodestyle + pyflakes; I: import order; B: bugbear; UP: modern syntax;
# S: bandit security rules; N: naming; SIM: simplifications; RUF: ruff-specific;
# T20: no print; BLE: no blind except; ASYNC: async pitfalls; PTH: pathlib; D: docstrings.
select = ["E", "W", "F", "I", "B", "UP", "S", "N", "SIM", "RUF", "T20", "BLE", "ASYNC", "PTH", "D"]
ignore = [
    "D105", # magic methods need no docstring
    "D107", # __init__ is documented on the class
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests use assert by design and do not need docstrings on every helper.
"tests/**" = ["S101", "D", "S105", "S106", "S608"]
"src/database_mcp/db/migrations/**" = ["D", "INP001"]
"scripts/**" = ["T20"]

[tool.mypy]
strict = true
python_version = "3.14"
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["database_mcp"]
exclude = ["src/database_mcp/db/migrations/"]

[[tool.mypy.overrides]]
module = ["testcontainers.*", "asyncpg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --cov=database_mcp --cov-report=term-missing --cov-fail-under=85"
markers = [
    "integration: needs Docker (testcontainers)",
]

[tool.coverage.run]
branch = true
source = ["database_mcp"]
