# CI: the same make targets as locally. Actions are pinned by commit SHA (tag in the comment) so
# a moved tag cannot change what runs [BSI DEV.4.4]. Least privilege for the token.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.13.7"
  KUBECONFORM_VERSION: v0.7.0
  KUBECONFORM_SHA256: c31518ddd122663b3f3aa874cfe8178cb0988de944f29c74a0b9260920d115d3

jobs:
  check:
    name: lint, typecheck, tests, chart
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.19.0
      - name: Install kubeconform (checksum verified)
        run: |
          curl -fsSLo /tmp/kc.tgz "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  /tmp/kc.tgz" | sha256sum -c -
          sudo tar -xzf /tmp/kc.tgz -C /usr/local/bin kubeconform
      - run: make install
      - run: make lint
      - run: make typecheck
      - run: make test
      - run: make helm-check
      - name: Known vulnerabilities in Python dependencies
        # The project itself is not on PyPI and is skipped; all locked dependencies are audited.
        run: uv run pip-audit --skip-editable --progress-spinner off

  image:
    name: image build and scans
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
      - run: make docker-build
      - name: Vulnerabilities in the image (fails on HIGH/CRITICAL with a fix)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: titanic-mcp:local
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Misconfigurations in Dockerfile and Helm chart
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
      - name: SBOM (CycloneDX, BSI TR-03183-2)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: titanic-mcp:local
          format: cyclonedx
          output: sbom.cdx.json
          skip-setup-trivy: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom.cdx.json

  e2e:
    name: end-to-end (Compose)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - run: make install
      - run: make up
      - run: make smoke
      - name: Logs on failure
        if: failure()
        run: docker compose logs
      - run: make down
        if: always()
